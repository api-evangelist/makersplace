description: 'MakersPlace is a curated marketplace for authentic digital creations, letting
  artists mint, sell, and collect verified digital artworks (NFTs) recorded on the blockchain.
  Founded in 2018 and based in San Francisco, it is known for high-profile digital art
  drops and for guaranteeing the authenticity and provenance of every creation. It was
  added to the API Evangelist network as a portfolio company of Pantera Capital in the
  crypto sector. As of this enrichment pass MakersPlace publishes no public developer
  API, documentation, or SDK surface.'
